<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b1c"><meta name="description" content="Chronova — 炫彩個人行程日曆"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Chronova｜星際日曆</title><style>
:root{color-scheme:dark;--bg:#090b1c;--panel:#171a32e8;--line:#ffffff25;--fg:#f5f4ff;--sub:#afb4d0;--a:#aa8dff;--b:#53d5f5;--c:#fd80c4;--glow:#6e57f855}body[data-theme=aurora]{--bg:#071c23;--panel:#123037ec;--a:#69f3ca;--b:#80baff;--c:#ffbb82;--glow:#43bfaa55}body[data-theme=sunset]{--bg:#220e24;--panel:#41263eef;--a:#ffaf73;--b:#ffd88f;--c:#ff83b9;--glow:#e763a255}body[data-theme=titan]{--bg:#151923;--panel:#2b303cef;--a:#e5e8ef;--b:#a6bddc;--c:#d1bcd3;--glow:#8d98b655}*{box-sizing:border-box}body{margin:0;color:var(--fg);font:15px system-ui,-apple-system,'Noto Sans TC',sans-serif;background:radial-gradient(ellipse at 18% -8%,var(--glow),transparent 52%),radial-gradient(ellipse at 100% 50%,#4b63b522,transparent 48%),var(--bg);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid var(--b)}.app{max-width:630px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 104px)}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:29px;font-weight:900;letter-spacing:-1px}.logo b{color:var(--a)}small,.muted{color:var(--sub)}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--sub)}.glass{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 15px 36px #0003;backdrop-filter:blur(18px)}.btn{border:1px solid var(--line);border-radius:13px;background:#ffffff10;color:var(--fg);padding:10px 13px}.primary{color:#0f1020;background:linear-gradient(120deg,var(--a),var(--b));border:0;font-weight:800}.chip{border:1px solid var(--line);background:#ffffff0a;color:var(--fg);padding:8px 12px;border-radius:40px}.chip.on{background:var(--a);color:#13131d;font-weight:800}.pad{padding:19px;margin-top:16px}.hero{margin:23px 0 16px}.big{font-size:32px;font-weight:850;letter-spacing:-1px;margin:6px 0}.monthhead{margin-bottom:18px}.arrows{display:flex;gap:7px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:3px}.weekdays{color:var(--sub);font-size:11px;margin-bottom:8px}.day{position:relative;min-height:52px;background:transparent;border:1px solid transparent;color:var(--fg);border-radius:15px;font-size:14px}.day.dim{opacity:.22}.day.today{border-color:var(--a)}.day.sel{background:linear-gradient(155deg,var(--a),var(--b));color:#101324;font-weight:900;box-shadow:0 4px 18px var(--glow)}.dots{display:flex;justify-content:center;gap:3px;height:5px;margin-top:5px}.dot{width:4px;height:4px;border-radius:50%;background:var(--c)}.day.sel .dot{background:#16162a}.day.weekend{color:var(--c)}.day.sel.weekend{color:#101324}.section{margin-top:23px}.event{display:flex;gap:12px;padding:13px;border:1px solid var(--line);background:#ffffff09;border-radius:17px;margin-top:9px;align-items:center}.stripe{height:39px;width:4px;border-radius:6px}.eventmain{flex:1;min-width:0}.eventmain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eventmain small{font-size:12px}.empty{color:var(--sub);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center}.float{position:fixed;right:max(20px,calc((100vw - 605px)/2 + 16px));bottom:calc(env(safe-area-inset-bottom) + 24px);border:0;width:60px;height:60px;border-radius:20px;font-size:29px;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 8px 32px var(--glow);z-index:3}.views{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}dialog{width:min(calc(100vw - 26px),510px);max-height:89dvh;overflow:auto;background:#16182e;color:white;border:1px solid #ffffff35;border-radius:24px;padding:22px}dialog::backdrop{background:#020310ba;backdrop-filter:blur(5px)}label{display:block;color:#c8c9dc;font-size:12px;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;color:var(--fg);background:#ffffff10;border:1px solid #ffffff33;border-radius:12px;color-scheme:dark}textarea{min-height:75px}.modalactions{display:flex;gap:8px;margin-top:20px}.modalactions button{flex:1}.settings .btn{margin:5px 4px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.title2{font-weight:800;font-size:18px}.listday{margin:14px 0}.listday h3{margin:8px 0}.listday .event{margin-top:7px}.banner{background:linear-gradient(120deg,#9b74f622,#47d9ee11);padding:14px;border:1px solid var(--line);border-radius:15px;margin-top:14px}@media(prefers-reduced-motion:no-preference){.glass{animation:pop .45s ease both}@keyframes pop{from{transform:translateY(8px);opacity:.65}to{transform:none;opacity:1}}}
</style></head><body><main class="app"><header class="flex"><div><div class="eyebrow">YOUR SPACE. YOUR TIME.</div><div class="logo">Chrono<b>va</b> ✧</div></div><button id="todaybtn" class="btn">今天</button></header><section class="hero"><div class="muted" id="greeting">每一天都有新的可能</div><h1 class="big" id="dateTitle"></h1><div class="views"><button class="chip on" data-view="month">月曆</button><button class="chip" data-view="week">週曆</button><button class="chip" data-view="day">日程</button><button class="chip" data-view="agenda">全部行程</button></div></section><section class="glass pad" id="calendar"><div class="flex monthhead"><div><div class="eyebrow" id="yearLabel"></div><div class="title2" id="monthLabel"></div></div><div class="arrows"><button class="btn" id="prev" aria-label="上一期">〈</button><button class="btn" id="next" aria-label="下一期">〉</button></div></div><div id="calendarBody"></div></section><section class="section"><div class="flex"><h2 class="title2" id="eventsHeading">當日行程</h2><button class="btn" id="searchBtn">⌕ 搜尋</button></div><div id="events"></div></section><section class="glass pad settings"><div class="flex"><div><div class="title2">個人化設定</div><small>選擇你的星際主題</small></div><span>✦</span></div><div class="toolbar" id="themes" style="margin-top:12px"><button class="chip" data-theme="nebula">星雲紫</button><button class="chip" data-theme="aurora">極光綠</button><button class="chip" data-theme="sunset">日落橘</button><button class="chip" data-theme="titan">鈦金灰</button></div><div class="banner"><small>行程儲存在這台裝置的瀏覽器中。刪除瀏覽器資料可能導致行程消失，建議定期匯出備份。</small></div><button class="btn" id="export">⇩ 匯出備份</button><button class="btn" id="import">⇧ 匯入備份</button><button class="btn" id="install" hidden>安裝 App</button><input type="file" id="file" accept=".json,application/json" class="hidden"></section></main><button class="float" id="add" aria-label="新增行程">＋</button><dialog id="editor"><form id="editForm"><h2 id="modalTitle">新增行程</h2><input id="eid" type="hidden"><label for="name">行程名稱</label><input id="name" maxlength="120" required placeholder="例如：與朋友聚餐"><label for="start">開始時間</label><input id="start" type="datetime-local" required><label for="end">結束時間（可不填）</label><input id="end" type="datetime-local"><label for="category">分類</label><select id="category"><option>生活</option><option>工作</option><option>旅行</option><option>重要</option><option>其他</option></select><label for="notes">備註</label><textarea id="notes" placeholder="地點、準備事項..."></textarea><div class="modalactions"><button type="button" class="btn" id="cancel">取消</button><button type="button" class="btn" id="delete" hidden>刪除</button><button type="submit" class="btn primary">儲存行程</button></div></form></dialog><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),today=new Date(),key='chronova.events.v1',themeKey='chronova.theme';let selected=new Date(today.getFullYear(),today.getMonth(),today.getDate()),focus=new Date(selected),view='month',events=[],deferred=null;
try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))events=stored.filter(x=>x&&typeof x.id==='string'&&typeof x.start==='string'&&typeof x.name==='string')}catch{}
const pad=x=>String(x).padStart(2,'0'),dateKey=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-'),fromKey=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},dateTime=d=>dateKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),colors={生活:'#a88eff',工作:'#63d4f5',旅行:'#5ce4bc',重要:'#ff88a9',其他:'#ffc471'};
const save=()=>{try{localStorage.setItem(key,JSON.stringify(events));return true}catch{alert('儲存失敗：瀏覽器儲存空間不足或受到限制');return false}};
function moveDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());return x}
function inDay(e,k){return e.start.slice(0,10)===k}function stamp(e){return e.start.slice(11,16)||'全天'}function drawEvent(e){const c=colors[e.category]||colors.其他;return '<article class="event"><div class="stripe" style="background:'+c+'"></div><div class="eventmain"><b>'+escape(e.name)+'</b><small>'+escape(e.start.slice(0,10))+'　'+escape(stamp(e))+' · '+escape(e.category)+'</small></div><button class="btn" data-edit="'+escape(e.id)+'" aria-label="編輯行程">編輯</button></article>'}
function calendar(){const m=focus.getMonth(),y=focus.getFullYear();$('dateTitle').textContent=selected.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});$('yearLabel').textContent=focus.getFullYear()+' / CHRONOVA';$('monthLabel').textContent=focus.toLocaleDateString('zh-TW',{year:'numeric',month:'long'});$('calendar').classList.toggle('hidden',view==='agenda');const head='<div class="weekdays">'+['日','一','二','三','四','五','六'].map(x=>'<div>'+x+'</div>').join('')+'</div>';let cells=[];if(view==='month'){const first=new Date(y,m,1),start=weekStart(first),total=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7)*7;for(let i=0;i<total;i++)cells.push(moveDays(start,i))}else if(view==='week'){const start=weekStart(selected);for(let i=0;i<7;i++)cells.push(moveDays(start,i))}else if(view==='day'){cells=[selected]}if(view==='day'){$('calendarBody').innerHTML='<div class="banner">'+selected.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'</div>'}else if(view==='agenda'){$('calendarBody').innerHTML=''}else{$('calendarBody').innerHTML=head+'<div class="days">'+cells.map(d=>{const k=dateKey(d),n=events.filter(e=>inDay(e,k)).length;return '<button class="day '+(d.getMonth()!==m&&view==='month'?'dim ':'')+(k===dateKey(today)?'today ':'')+(k===dateKey(selected)?'sel ':'')+([0,6].includes(d.getDay())?'weekend':'')+'" data-date="'+k+'">'+d.getDate()+'<div class="dots">'+(n?'<span class="dot"></span>':'')+(n>1?'<span class="dot"></span>':'')+(n>2?'<span class="dot"></span>':'')+'</div></button>'}).join('')+'</div>'}}
function draw(){calendar();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));const es=[...events].sort((a,b)=>a.start.localeCompare(b.start));$('eventsHeading').textContent=view==='agenda'?'所有行程':selected.toLocaleDateString('zh-TW',{month:'long',day:'numeric'})+'的行程';const shown=view==='agenda'?es:es.filter(e=>inDay(e,dateKey(selected)));$('events').innerHTML=shown.length?shown.map(drawEvent).join(''):'<div class="empty">這裡還沒有行程。點右下角 ＋ 開始安排。</div>'}
function openEdit(e){$('editForm').reset();$('eid').value=e?.id||'';$('modalTitle').textContent=e?'編輯行程':'新增行程';$('name').value=e?.name||'';$('start').value=e?.start||dateTime(new Date(selected.getFullYear(),selected.getMonth(),selected.getDate(),9));$('end').value=e?.end||'';$('category').value=e?.category||'生活';$('notes').value=e?.notes||'';$('delete').hidden=!e;$('editor').showModal()}
document.addEventListener('click',ev=>{const d=ev.target.closest('[data-date]');if(d){selected=fromKey(d.dataset.date);focus=new Date(selected);draw()}const e=ev.target.closest('[data-edit]');if(e){const found=events.find(x=>x.id===e.dataset.edit);if(found)openEdit(found)}});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;focus=new Date(selected);draw()});
$('prev').onclick=()=>{if(view==='month')focus=new Date(focus.getFullYear(),focus.getMonth()-1,1);else if(view==='week'){selected=moveDays(selected,-7);focus=new Date(selected)}else{selected=moveDays(selected,-1);focus=new Date(selected)};draw()};
$('next').onclick=()=>{if(view==='month')focus=new Date(focus.getFullYear(),focus.getMonth()+1,1);else if(view==='week'){selected=moveDays(selected,7);focus=new Date(selected)}else{selected=moveDays(selected,1);focus=new Date(selected)};draw()};
$('todaybtn').onclick=()=>{selected=new Date(today.getFullYear(),today.getMonth(),today.getDate());focus=new Date(selected);draw()};$('add').onclick=()=>openEdit();$('cancel').onclick=()=>$('editor').close();
$('editForm').onsubmit=e=>{e.preventDefault();const obj={id:$('eid').value||String(Date.now())+'-'+Math.random().toString(36).slice(2),name:$('name').value.trim(),start:$('start').value,end:$('end').value,category:$('category').value,notes:$('notes').value};if(!obj.name)return;if(obj.end&&obj.end<obj.start)return alert('結束時間不能早於開始時間');const idx=events.findIndex(x=>x.id===obj.id);if(idx<0)events.push(obj);else events[idx]=obj;if(save()){selected=fromKey(obj.start.slice(0,10));focus=new Date(selected);$('editor').close();draw()}};
$('delete').onclick=()=>{if(!confirm('確定刪除這個行程？'))return;events=events.filter(x=>x.id!==$('eid').value);if(save()){$('editor').close();draw()}};
$('searchBtn').onclick=()=>{const q=prompt('搜尋行程名稱、備註或分類');if(q===null)return;const found=events.filter(x=>(x.name+' '+x.notes+' '+x.category).toLowerCase().includes(q.trim().toLowerCase())).sort((a,b)=>a.start.localeCompare(b.start));view='agenda';draw();$('eventsHeading').textContent='搜尋結果 · '+found.length+' 筆';$('events').innerHTML=found.length?found.map(drawEvent).join(''):'<div class="empty">沒有找到符合的行程</div>'};
function setTheme(t){document.body.dataset.theme=t;try{localStorage.setItem(themeKey,t)}catch{}document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===t))}document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));setTheme(localStorage.getItem(themeKey)||'nebula');
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Chronova',version:1,events},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='chronova-backup-'+dateKey(today)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.events;if(!Array.isArray(arr)||arr.some(x=>!x||typeof x.id!=='string'||typeof x.name!=='string'||typeof x.start!=='string'||!/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(x.start)))throw Error('備份格式不正確');if(!confirm('匯入 '+arr.length+' 筆行程？相同 ID 會覆蓋現有資料。'))return;const map=new Map(events.map(x=>[x.id,x]));for(const x of arr)map.set(x.id,{id:x.id,name:x.name,start:x.start,end:x.end||'',category:x.category||'其他',notes:x.notes||''});events=[...map.values()];if(save()){draw();alert('匯入完成')}}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
let startX=0;$('calendar').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('calendar').addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>75)(delta>0?$('prev'):$('next')).click()},{passive:true});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true}};
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});draw();
})();
</script></body></html>
